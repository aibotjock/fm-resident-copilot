openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: clinical
    description: Clinical AI query operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /clinical/query:
    post:
      operationId: clinicalQuery
      tags: [clinical]
      summary: Submit a clinical query and receive a streaming AI response
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClinicalQueryBody"
      responses:
        "200":
          description: SSE stream of AI response chunks
          content:
            text/event-stream: {}
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ClinicalQueryBody:
      type: object
      properties:
        query:
          type: string
          description: The clinical question or prompt
        mode:
          type: string
          enum: [point_of_care, documentation, board_prep, flashcards]
          description: The clinical mode for prompt context
        condition:
          type: string
          description: Optional condition name for context
      required:
        - query
        - mode
