services:
  - type: web
    name: fm-copilot-server
    runtime: node
    region: oregon
    plan: free
    rootDir: server
    buildCommand: npm install --include=dev && npm run build && cd ../client && npm install --include=dev && npm run build
    startCommand: npm run start:deploy
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: DATABASE_URL
        fromDatabase:
          name: fm-copilot-db
          property: connectionString
      - key: OPENAI_API_KEY
        sync: false
    healthCheckPath: /api/healthz

databases:
  - name: fm-copilot-db
    databaseName: fmcopilot
    plan: free
    region: oregon
